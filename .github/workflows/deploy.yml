name: CyberAI Digest

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"   # 08:30 Suomen aikaa (varmennus alla)
    - cron: "0 15 * * *"  # 18:00 Suomen aikaa — varmuusajo jos aamu putoaa
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna riippuvuudet (aina tuoreimmat versiot)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade feedparser edge-tts gtts requests

      - name: Aja digest-agentti
        run: python cyberai_agent.py
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DIGEST_BASE_URL: https://devzoneos.github.io/cyberai-digest
          DIGEST_HOME: ${{ github.workspace }}

      - name: Commit & julkaise
        run: |
          git config user.name "digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add audio/ digests/ podcast.xml sources.md seen.txt feeds.txt
          git commit -m "digest ${GITHUB_RUN_ID}" || echo "ei muutoksia"
          git push
